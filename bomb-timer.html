<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Realistic Industrial Button</title>
    <style>
        :root {
            --bg-color: #1a1a1e;
            --metal-dark: #2b2b2b;
            --panel-grad-1: #2a2a2e;
            --panel-grad-2: #1f1f22;
            --led-off: #220000;
            --led-on: #ff0000;
            
            /* Dynamic Fuse Variables (Set by JS) */
            --fuse-len: 150px; 
            /* Updated path: Starts lower (25) to appear at button edge */
            --path-str: "M 60 25 C 60 40, 25 40, 40 65 C 50 80, 65 85, 60 90";
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, #333842 0%, transparent 70%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* --- The Main Panel Housing --- */
        .panel-housing {
            position: relative;
            width: 340px;
            height: 480px;
            background: linear-gradient(145deg, var(--panel-grad-1), var(--panel-grad-2));
            border-radius: 30px;
            box-shadow: 
                20px 20px 60px #121215, 
                -20px -20px 60px #26262e,
                inset 0 0 0 2px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            border: 1px solid rgba(0,0,0,0.8);
            transition: transform 0.1s;
            z-index: 1;
        }

        /* Broken State Transform */
        .panel-housing.destroyed {
            transform: rotate(2deg) translateY(10px);
            filter: grayscale(0.8) contrast(1.2) brightness(0.8);
        }
        .panel-housing.destroyed .label { color: #333; text-shadow: none; }
        .panel-housing.destroyed .led { background: #100; box-shadow: none; }
        .panel-housing.destroyed .status-display { color: red; text-shadow: 0 0 5px red; animation: flicker 0.2s infinite; }
        /* Disable inputs when destroyed */
        .panel-housing.destroyed .timer-input { pointer-events: none; opacity: 0.5; }

        @keyframes flicker {
            0% { opacity: 0.1; }
            50% { opacity: 1; }
            100% { opacity: 0.1; }
        }

        /* Decorative Screws */
        .screw {
            position: absolute;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #666, #111);
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,1), 1px 1px 2px rgba(255,255,255,0.1);
            z-index: 2;
        }
        .screw::after, .screw::before {
            content: ''; position: absolute; top: 50%; left: 50%; background: #000;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .screw::after { width: 70%; height: 2px; box-shadow: 0 1px 0 rgba(255,255,255,0.1); }
        .screw::before { width: 2px; height: 70%; box-shadow: 1px 0 0 rgba(255,255,255,0.1); }
        
        .tl { top: 15px; left: 15px; transform: rotate(22deg); }
        .tr { top: 15px; right: 15px; transform: rotate(-15deg); }
        .bl { bottom: 15px; left: 15px; transform: rotate(45deg); }
        .br { bottom: 15px; right: 15px; transform: rotate(10deg); }

        /* Carbon Fiber Inlay */
        .plate-inlay {
            position: absolute;
            width: 300px;
            height: 440px;
            border-radius: 20px;
            background: 
                radial-gradient(black 15%, transparent 16%) 0 0,
                radial-gradient(black 15%, transparent 16%) 8px 8px,
                radial-gradient(rgba(255,255,255,.1) 15%, transparent 20%) 0 1px,
                radial-gradient(rgba(255,255,255,.1) 15%, transparent 20%) 8px 9px;
            background-color: #181818;
            background-size: 16px 16px;
            box-shadow: inset 4px 4px 10px rgba(0,0,0,0.9), inset -2px -2px 5px rgba(255,255,255,0.05);
            z-index: 0;
        }

        /* --- The Chrome Ring & Button --- */
        .chrome-ring {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(from 45deg, #888, #fff, #888, #444, #888, #fff, #888);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.5), inset 0 -2px 5px rgba(0,0,0,0.8);
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            margin-bottom: 0; 
        }
        .chrome-ring::before {
            content: ''; position: absolute; inset: 4px; border-radius: 50%;
            background: #111; box-shadow: inset 0 5px 15px rgba(0,0,0,1); z-index: 1;
        }

        .button-core {
            position: relative; z-index: 10; width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, #b03030, #600000);
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: 0 -2px 5px rgba(255,255,255,0.2), 0 10px 20px rgba(0,0,0,0.6), inset 0 5px 15px rgba(0,0,0,0.4), inset 0 -5px 15px rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .button-core::after {
            content: ''; position: absolute; top: 5%; left: 20%; width: 60%; height: 40%;
            border-radius: 50%; background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            filter: blur(2px); pointer-events: none;
        }
        .button-core:active { transform: scale(0.93) translateY(4px); box-shadow: 0 -1px 2px rgba(255,255,255,0.1), 0 2px 5px rgba(0,0,0,0.8), inset 0 10px 20px rgba(0,0,0,0.6); }
        
        .inner-mechanism {
            width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            background: radial-gradient(circle, rgba(100,0,0,0.5), transparent);
        }
        .label {
            color: rgba(0, 0, 0, 0.6); font-size: 14px; font-weight: 900; letter-spacing: 2px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.1); margin-top: 10px; z-index: 12;
        }
        .led {
            width: 8px; height: 8px; background-color: #400; border-radius: 50%; margin-bottom: 5px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5); transition: all 0.3s ease; z-index: 12; position: relative;
        }
        .led::after { content: ''; position: absolute; top: 1px; left: 2px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.5; }

        /* Active State (Armed) */
        .active-state .button-core { background: radial-gradient(circle at 50% 30%, #ff5555, #aa0000); box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), 0 -2px 5px rgba(255,255,255,0.4), inset 0 5px 15px rgba(0,0,0,0.4); }
        .active-state .led { background-color: #ff0000; box-shadow: 0 0 10px #ff0000; }

        /* --- BOMB & FUSE AREA --- */
        .bomb-container {
            position: relative;
            width: 120px;
            height: 160px; 
            z-index: 5;
            margin-top: -20px; /* Tuck under the button ring visually */
            display: flex;
            justify-content: center;
            align-items: flex-end; 
        }

        /* The Bomb Body */
        .bomb-body {
            position: absolute;
            bottom: 10px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #444, #111 60%, #000);
            border-radius: 50%;
            box-shadow: 
                0 15px 15px rgba(0,0,0,0.8),
                inset -5px -5px 15px rgba(0,0,0,0.9);
            z-index: 2;
        }
        .bomb-neck {
            position: absolute;
            bottom: 75px;
            width: 20px;
            height: 15px;
            background: linear-gradient(to right, #222, #555, #222);
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 1;
        }

        /* Fuse SVG */
        .fuse-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
            z-index: 0;
        }
        .fuse-path {
            fill: none;
            stroke: #8b7d6b; /* Rope color */
            stroke-width: 3;
            stroke-linecap: round;
            
            /* Setup for animation */
            stroke-dasharray: var(--fuse-len);
            stroke-dashoffset: 0;
        }

        /* The Spark */
        .spark {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #fff, #ffaa00, transparent);
            border-radius: 50%;
            top: 0; left: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 4px #ff5500);
            transform: translate(-50%, -50%);
            
            /* The motion path matches SVG exactly */
            offset-path: path("M 60 25 C 60 40, 25 40, 40 65 C 50 80, 65 85, 60 90");
        }
        
        /* SPARK ANIMATION: Follows path 0% -> 100% */
        @keyframes travelPath {
            0% { offset-distance: 0%; opacity: 1; transform: scale(1); }
            90% { opacity: 1; transform: scale(1.5); }
            100% { offset-distance: 100%; opacity: 0; transform: scale(0.1); }
        }
        
        /* ROPE ANIMATION: Disappears from Start(Top) to End(Bottom) */
        /* To do this, we animate offset from 0 to -Length */
        @keyframes ropeVanish {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: calc(var(--fuse-len) * -1); }
        }
        
        /* Classes added by JS with dynamic duration */
        .spark.burning {
            animation-name: travelPath;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
        
        .fuse-path.burning {
            animation-name: ropeVanish;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        /* --- TIMER INPUT PANEL --- */
        .config-panel {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            background: linear-gradient(145deg, #2b2b2b, #222);
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #111;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.05), 2px 2px 5px rgba(0,0,0,0.5);
        }
        .timer-label {
            font-size: 8px;
            color: #888;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .timer-input {
            width: 50px;
            background: #000;
            border: 1px solid #444;
            color: #ff3333;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-radius: 2px;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
            padding: 2px;
        }
        .timer-input:focus {
            border-color: #666;
            color: #ff5555;
        }

        /* --- RESET BUTTON --- */
        .reset-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #444, #333);
            border: 1px solid #111;
            border-radius: 4px;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.5), inset 1px 1px 0 rgba(255,255,255,0.1);
            cursor: pointer;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            color: #888;
            font-family: sans-serif;
            transition: transform 0.1s;
        }
        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.5), inset 2px 2px 5px rgba(0,0,0,0.8);
        }
        .reset-led {
            width: 6px; height: 6px; background: #220000; margin-bottom: 4px;
            border-radius: 50%; box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }
        .reset-btn.ready .reset-led { background: #00ff00; box-shadow: 0 0 4px #00ff00; }

        /* --- STATUS DISPLAY --- */
        .status-display {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: #444; font-size: 10px; letter-spacing: 1px; text-shadow: 0 -1px 0 black; pointer-events: none;
        }

        /* --- EXPLOSION FX --- */
        .white-flash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: white; z-index: 999; opacity: 0; pointer-events: none;
        }
        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .cracked-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 90; opacity: 0; pointer-events: none;
            background: 
                linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.2) 49%, transparent 51%),
                linear-gradient(-45deg, transparent 45%, rgba(255,255,255,0.1) 46%, transparent 48%);
            mix-blend-mode: overlay;
        }
        .destroyed .cracked-screen { opacity: 1; }

    </style>
</head>
<body>

    <!-- Flash Overlay -->
    <div class="white-flash" id="whiteFlash"></div>

    <div class="panel-housing" id="panel">
        <div class="cracked-screen"></div>
        <div class="screw tl"></div>
        <div class="screw tr"></div>
        <div class="screw bl"></div>
        <div class="screw br"></div>
        
        <div class="plate-inlay"></div>

        <div id="button-wrapper" class="chrome-ring">
            <div class="button-core" id="mainButton">
                <div class="inner-mechanism">
                    <div class="led"></div>
                    <span class="label">INITIATE</span>
                </div>
            </div>
        </div>

        <!-- Bomb Visuals -->
        <div class="bomb-container">
            <div class="bomb-neck"></div>
            <div class="bomb-body"></div>
            <svg class="fuse-svg" viewBox="0 0 120 160">
                <!-- Path starts lower (25) to tuck just under button edge -->
                <path class="fuse-path" id="fusePath" d="M 60 25 C 60 40, 25 40, 40 65 C 50 80, 65 85, 60 90" />
            </svg>
            <div class="spark" id="spark"></div>
        </div>

        <div class="status-display" id="statusText">SYSTEM READY</div>

        <!-- Timer Input Panel -->
        <div class="config-panel">
            <span class="timer-label">TIMER (S)</span>
            <input type="number" id="fuseTimeInput" class="timer-input" value="3" min="1" max="60" step="0.1">
        </div>

        <!-- Reset Button -->
        <div class="reset-btn" id="resetButton">
            <div class="reset-led"></div>
            <span>RESET</span>
        </div>
    </div>

    <script>
        const button = document.getElementById('mainButton');
        const wrapper = document.getElementById('button-wrapper');
        const statusText = document.getElementById('statusText');
        const spark = document.getElementById('spark');
        const fusePath = document.getElementById('fusePath');
        const panel = document.getElementById('panel');
        const whiteFlash = document.getElementById('whiteFlash');
        const resetBtn = document.getElementById('resetButton');
        const fuseTimeInput = document.getElementById('fuseTimeInput');
        
        // --- SYNC LOGIC ---
        // We calculate the exact length of the SVG path to synchronize the CSS animations
        const fuseLength = fusePath.getTotalLength();
        document.documentElement.style.setProperty('--fuse-len', fuseLength + 'px');
        
        let state = 'READY'; // READY, ARMED, DESTROYED
        let audioCtx = null;
        let countdownTimer = null;
        let noiseNode = null; 

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // --- SOUND GEN ---
        function createNoiseBuffer() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }

        function playFuseSound() {
            if (!audioCtx) return;
            const buffer = createNoiseBuffer();
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1000;

            const gain = audioCtx.createGain();
            gain.gain.value = 0.15;

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
            
            noiseNode = { source: noise, gain: gain };
        }

        function stopFuseSound() {
            if (noiseNode) {
                noiseNode.source.stop();
                noiseNode = null;
            }
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            
            // Boom
            const noise = audioCtx.createBufferSource();
            noise.buffer = createNoiseBuffer();
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(800, t);
            noiseFilter.frequency.exponentialRampToValueAtTime(10, t + 1.5);
            
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(1, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 1.5);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(t);
            noise.stop(t+2);

            // Crack
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, t);
            osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.5);
            
            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.5, t);
            oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t+0.5);
        }

        function playClick() {
             if (!audioCtx) return;
             const osc = audioCtx.createOscillator();
             const gain = audioCtx.createGain();
             osc.frequency.setValueAtTime(200, audioCtx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
             gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
             gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
             osc.connect(gain);
             gain.connect(audioCtx.destination);
             osc.start();
             osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- LOGIC ---

        button.addEventListener('mousedown', () => {
            if (state !== 'READY') return;
            button.style.transform = "scale(0.93) translateY(4px)";
            initAudio();
            playClick();
        });

        button.addEventListener('mouseup', () => {
            button.style.transform = "";
            if (state === 'READY') {
                armBomb();
            }
        });

        function armBomb() {
            state = 'ARMED';
            
            // Get user input time
            let fuseDuration = parseFloat(fuseTimeInput.value);
            if (isNaN(fuseDuration) || fuseDuration < 0.1) fuseDuration = 3;
            
            wrapper.classList.add('active-state');
            statusText.innerText = `FUSE LIT - ${fuseDuration} SECONDS`;
            statusText.style.color = "orange";
            
            // Apply dynamic duration to animation
            spark.style.animationDuration = fuseDuration + 's';
            fusePath.style.animationDuration = fuseDuration + 's';

            spark.classList.add('burning');
            fusePath.classList.add('burning');
            
            fuseTimeInput.disabled = true;
            
            playFuseSound();

            countdownTimer = setTimeout(() => {
                explode();
            }, fuseDuration * 1000);
        }

        function explode() {
            state = 'DESTROYED';
            stopFuseSound();
            playExplosionSound();
            
            whiteFlash.style.animation = "flash 0.5s ease-out";
            panel.classList.add('destroyed');
            statusText.innerText = "CRITICAL FAILURE";
            resetBtn.classList.add('ready');
            
            wrapper.classList.remove('active-state');
            button.style.cursor = "not-allowed";
        }

        resetBtn.addEventListener('click', () => {
            if (state !== 'DESTROYED') return;
            
            playClick();
            
            state = 'READY';
            
            panel.classList.remove('destroyed');
            whiteFlash.style.animation = "none";
            whiteFlash.offsetHeight; 
            
            spark.classList.remove('burning');
            fusePath.classList.remove('burning');
            
            // Clear inline styles so animations can be reapplied fresh next time
            spark.style.animationDuration = '';
            fusePath.style.animationDuration = '';
            
            resetBtn.classList.remove('ready');
            fuseTimeInput.disabled = false;
            
            statusText.innerText = "SYSTEM READY";
            statusText.style.color = "#444";
            button.style.cursor = "pointer";
        });

    </script>
</body>
</html>
